<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Você em Bananas Caturras 🍌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #fff4a8 0,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #ffd36e 0,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff8d6,
          #ffe9a3
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      color: #302500;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);

      border: 3px solid #f4c400;
      border-radius: 32px;

      padding: 42px 36px;

      text-align: center;

      box-shadow:
        0 25px 60px rgba(126, 91, 0, 0.18),
        0 8px 20px rgba(126, 91, 0, 0.12);

      backdrop-filter: blur(10px);
    }

    .banana {
      font-size: 76px;

      display: block;

      margin-bottom: 8px;

      animation:
        float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform:
          translateY(0)
          rotate(-5deg);
      }

      50% {
        transform:
          translateY(-8px)
          rotate(5deg);
      }
    }

    h1 {
      margin: 0;

      font-size: 38px;
      font-weight: 900;

      color: #d49d00;

      letter-spacing: -1px;
    }

    .subtitle {
      margin:
        10px
        0
        32px;

      color: #77652b;

      font-size: 16px;

      line-height: 1.5;
    }

    .input-wrapper {
      text-align: left;

      margin-bottom: 18px;
    }

    label {
      display: block;

      font-size: 14px;
      font-weight: bold;

      margin-bottom: 8px;

      color: #5d4b12;
    }

    .input-box {
      display: flex;

      align-items: center;

      background: #fffdf1;

      border: 2px solid #e9cd55;

      border-radius: 16px;

      overflow: hidden;

      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: #d9a900;

      box-shadow:
        0 0 0 4px
        rgba(244, 196, 0, 0.15);
    }

    input {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      padding: 17px;

      font-size: 20px;
      font-weight: bold;

      color: #302500;
    }

    input::placeholder {
      color: #b9a85e;
    }

    .unit {
      padding: 0 18px;

      font-weight: bold;

      color: #8a741e;
    }

    button {
      width: 100%;

      border: 0;

      border-radius: 16px;

      padding: 17px;

      background:
        linear-gradient(
          135deg,
          #ffd21c,
          #f0ad00
        );

      color: #3d2d00;

      font-size: 18px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 7px 0 #c58d00;

      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 9px 0 #c58d00;
    }

    button:active {
      transform: translateY(4px);

      box-shadow:
        0 3px 0 #c58d00;
    }

    .result {
      display: none;

      margin-top: 28px;

      padding: 25px 18px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #fff8c7,
          #fff0a0
        );

      border: 2px dashed #e4b900;
    }

    .result.show {
      display: block;

      animation:
        appear 0.35s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;

        transform:
          translateY(10px)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    .result-label {
      font-size: 14px;

      color: #806b1e;

      font-weight: bold;

      margin-bottom: 6px;
    }

    .result-number {
      font-size: 48px;

      font-weight: 900;

      color: #c28c00;

      line-height: 1.1;
    }

    .result-number span {
      font-size: 25px;
    }

    .banana-row {
      margin-top: 15px;

      font-size: 28px;

      word-break: break-word;

      line-height: 1.4;

      max-height: 180px;

      overflow-y: auto;

      padding: 5px;
    }

    .whatsapp-button {
      margin-top: 20px;

      background:
        linear-gradient(
          135deg,
          #25d366,
          #19b957
        );

      color: white;

      box-shadow:
        0 7px 0 #159447;
    }

    .whatsapp-button:hover {
      box-shadow:
        0 9px 0 #159447;
    }

    .whatsapp-button:active {
      box-shadow:
        0 3px 0 #159447;
    }

    .info {
      margin-top: 25px;

      font-size: 12px;

      color: #958044;
    }

    .error {
      color: #c0392b;

      font-size: 13px;

      font-weight: bold;

      margin-top: 10px;

      display: none;
    }

    footer {
      margin-top: 18px;

      text-align: center;

      font-size: 11px;

      color: #9b8741;
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding:
          32px 22px;

        border-radius: 26px;
      }

      h1 {
        font-size: 31px;
      }

      .banana {
        font-size: 64px;
      }

      .result-number {
        font-size: 40px;
      }

      .banana-row {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <span class="banana">🍌</span>

      <h1>
        Você em Bananas Caturras
      </h1>

      <p class="subtitle">
        Descubra quantas
        <strong>bananas caturras</strong>
        são necessárias para representar
        a sua altura.
      </p>

      <div class="input-wrapper">

        <label for="altura">
          Qual é a sua altura?
        </label>

        <div class="input-box">

          <input
            id="altura"
            type="number"
            min="1"
            step="0.1"
            placeholder="Ex: 175"
          >

          <span class="unit">
            cm
          </span>

        </div>

        <div
          class="error"
          id="error"
        >
          Digite uma altura válida.
        </div>

      </div>

      <button onclick="converter()">
        🍌 Descobrir minha altura em bananas
      </button>

      <div
        class="result"
        id="result"
      >

        <div class="result-label">
          Você mede aproximadamente
        </div>

        <div class="result-number">

          <span id="numero">
          </span>

          <span>
            🍌
          </span>

        </div>

        <div
          class="banana-row"
          id="bananaRow"
        >
        </div>

        <button
          class="whatsapp-button"
          onclick="compartilharWhatsApp()"
        >
          📱 Compartilhar no WhatsApp
        </button>

      </div>

      <div class="info">
        🍌 Uma banana caturra mede aproximadamente
        <strong>15 cm</strong>.
      </div>

    </section>

    <footer>
      Ciência 100% questionável™
    </footer>

  </main>


  <script>

    // Tamanho utilizado para a brincadeira
    const TAMANHO_BANANA = 15;


    function converter() {

      const input =
        document.getElementById("altura");

      const result =
        document.getElementById("result");

      const error =
        document.getElementById("error");

      const numero =
        document.getElementById("numero");

      const bananaRow =
        document.getElementById("bananaRow");


      const altura =
        Number(input.value);


      // Validação
      if (!altura || altura <= 0) {

        error.style.display = "block";

        result.classList.remove("show");

        return;
      }


      error.style.display = "none";


      // Calcula quantidade de bananas
      const bananas =
        altura / TAMANHO_BANANA;


      // Mostra resultado com duas casas decimais
      numero.textContent =
        bananas.toFixed(2);


      /*
       * Mostra bananas visualmente.
       *
       * Limitamos a 50 emojis para evitar que
       * uma altura muito grande quebre o layout.
       */
      const bananasInteiras =
        Math.min(
          Math.round(bananas),
          50
        );


      bananaRow.textContent =
        "🍌".repeat(bananasInteiras);


      // Reinicia a animação
      result.classList.remove("show");

      void result.offsetWidth;

      result.classList.add("show");
    }


    function compartilharWhatsApp() {

      const altura =
        document.getElementById("altura").value;

      const bananas =
        document.getElementById("numero").textContent;


      const mensagem =
        `VOCÊ EM BANANAS CATURRAS\n\n` +
        `Minha altura: ${altura} cm\n` +
        `Isso equivale a ${bananas} bananas caturras!\n\n` +
        `E você? Quantas bananas caturras mede?\n\n` +
        `Faça o teste agora em https://omiuner.github.io/banana_caturra/\n\n`;


      const url =
        `https://wa.me/?text=${encodeURIComponent(mensagem)}`;


      window.open(
        url,
        "_blank"
      );
    }


    // Permite apertar Enter no campo
    document
      .getElementById("altura")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            converter();
          }

        }
      );

  </script>

</body>
</html>
